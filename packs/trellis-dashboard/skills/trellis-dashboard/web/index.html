<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trellis Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-main">
        <h1>Trellis Dashboard</h1>
        <div id="repoMeta" class="muted"></div>
      </div>
      <div class="topbar-actions">
        <button data-page="tasks" class="page-tab active" type="button">Tasks</button>
        <button data-page="specs" class="page-tab" type="button">Specs</button>
      </div>
      <div class="stats" id="summaryStats"></div>
    </header>
    <main id="tasksPage" class="layout page-view active">
      <aside class="sidebar panel">
        <div class="sidebar-head">
          <div class="section-title">Tasks</div>
          <div id="taskCount" class="muted small"></div>
        </div>
        <div class="task-controls">
          <div id="statusFilters" class="filter-chips"></div>
          <div class="filter-row">
            <label class="filter-label" for="assigneeFilter">人员</label>
            <select id="assigneeFilter" class="filter-select"></select>
          </div>
        </div>
        <div id="taskList" class="task-list"></div>
        <div class="pagination" id="taskPagination">
          <button id="prevPage" class="page-btn" type="button">上一页</button>
          <div id="pageInfo" class="muted"></div>
          <button id="nextPage" class="page-btn" type="button">下一页</button>
        </div>
      </aside>
      <section class="content">
        <div class="panel hero" id="currentPanel"></div>
        <div class="panel task-actions">
          <button id="deleteTaskBtn" class="danger-btn" type="button">删除当前 Task</button>
          <div class="muted small">删除会移除当前 task 目录；Specs 在顶部 Specs 页面预览和编辑项目级 .trellis/spec。</div>
        </div>
        <div class="panel tabs">
          <div class="tab-row">
            <button data-tab="overview" class="tab active">Overview</button>
            <button data-tab="prd" class="tab">PRD</button>
            <button data-tab="info" class="tab">Info</button>
            <button data-tab="context" class="tab">Context</button>
            <button data-tab="research" class="tab">Research</button>
            <button data-tab="summary" class="tab">Summary</button>
            <button data-tab="raw" class="tab">Raw</button>
          </div>
          <div id="detailBody" class="detail-body"></div>
        </div>
      </section>
      <aside class="events panel">
        <div class="section-title">Recent Events</div>
        <div id="eventList" class="event-list"></div>
      </aside>
    </main>
    <main id="specsPage" class="project-page page-view">
      <section class="panel project-panel">
        <div class="section-title">Project Specs (.trellis/spec)</div>
        <div id="specsBody" class="project-body"></div>
      </section>
    </main>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalTitle" class="modal-title"></div>
      <div id="modalMessage" class="modal-message"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="page-btn" type="button">\u53d6\u6d88</button>
        <button id="modalConfirm" class="danger-btn" type="button">\u786e\u8ba4</button>
      </div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
