<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file: data:; img-src 'self' file: data:;" />
    <title>CodeBuddy Pet</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; font-family: Arial, sans-serif; user-select: none; }
      #pet-root { position: relative; width: 100vw; height: 100vh; -webkit-app-region: drag; }
      #sprite { position: absolute; left: 50%; bottom: 14px; width: 136px; height: 147px; transform: translateX(-50%); pointer-events: auto; cursor: pointer; filter: drop-shadow(0 10px 12px rgba(0,0,0,0.24)); -webkit-app-region: no-drag; }
      #bubble { position: absolute; left: 50%; top: 8px; max-width: 180px; transform: translateX(-50%); padding: 8px 10px; border-radius: 8px; background: rgba(24,24,28,0.88); color: white; font-size: 12px; line-height: 1.35; white-space: pre-line; opacity: 0; transition: opacity 120ms ease, transform 120ms ease; pointer-events: auto; -webkit-app-region: no-drag; }
      #bubble.visible { opacity: 1; }
      #bubble.react { transform: translateX(-50%) translateY(-3px); }
    </style>
  </head>
  <body>
    <div id="pet-root"><div id="bubble"></div><canvas id="sprite" width="192" height="208" aria-label="CodeBuddy Pet"></canvas></div>
    <script src="./renderer.js"></script>
  </body>
</html>
